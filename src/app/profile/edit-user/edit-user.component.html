<section class="rounded-lg border border-slate-200 bg-white p-6">
  <h2 class="text-lg font-semibold text-slate-900">Edit profile</h2>
  @if (error(); as err) {
    <p class="mt-3 rounded-md bg-rose-50 p-3 text-sm text-rose-700">{{ err }}</p>
  }
  <form class="mt-4 grid gap-4 sm:grid-cols-2" (ngSubmit)="save()">
    <input [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" placeholder="Name" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" type="email" placeholder="Email" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" placeholder="Phone" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="street()" (ngModelChange)="street.set($event)" name="street" placeholder="Street" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="apartment()" (ngModelChange)="apartment.set($event)" name="apartment" placeholder="Apartment" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="city()" (ngModelChange)="city.set($event)" name="city" placeholder="City" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="zip()" (ngModelChange)="zip.set($event)" name="zip" placeholder="ZIP / Postal" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="country()" (ngModelChange)="country.set($event)" name="country" placeholder="Country" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
    <input [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" type="password" placeholder="New password (optional)" class="rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 sm:col-span-2" />
    <div class="sm:col-span-2">
      <button type="submit" [disabled]="saving()" class="rounded-md bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50">
        {{ saving() ? 'Saving...' : 'Save changes' }}
      </button>
    </div>
  </form>
</section>
