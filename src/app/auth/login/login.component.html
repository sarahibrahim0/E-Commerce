<div class="w-full ps-[175px] pe-[175px] pt-page-x pb-section">
  <div class="mx-auto max-w-md">
  <h1 class="text-2xl font-bold text-blue-black" i18n="Sign in heading|@@login.title">Sign in</h1>
  <p class="mt-1 text-sm text-[#797979]" i18n="Welcome back message|@@login.welcomeBack">Welcome back!</p>

  @if (auth.error(); as err) {
    <p class="mt-4 rounded-md bg-[#fff5f5] p-3 text-sm text-[#ff4545]">{{ err }}</p>
  }

  <form class="mt-6 space-y-4" (ngSubmit)="submit()">
    <div>
      <label for="email" class="block text-sm font-medium text-[#646D77]" i18n="Email label|@@login.email">Email</label>
      <input
        id="email" name="email" type="email" required autocomplete="email"
        [value]="email()" (input)="email.set($any($event.target).value)"
        class="mt-1 w-full rounded-md border border-[#c9c9c9] px-3 py-2 text-sm outline-none focus:border-salmon"
      />
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-[#646D77]" i18n="Password label|@@login.password">Password</label>
      <div class="relative mt-1">
        <input
          id="password" name="password" [type]="showPassword() ? 'text' : 'password'" required autocomplete="current-password"
          [value]="password()" (input)="password.set($any($event.target).value)"
          class="w-full rounded-md border border-[#c9c9c9] px-3 py-2 pe-10 text-sm outline-none focus:border-salmon"
        />
        <button type="button" (click)="showPassword.set(!showPassword())" class="absolute end-3 top-1/2 -translate-y-1/2 text-[#797979] hover:text-blue-black transition-colors" i18n-aria-label="Toggle password visibility|@@login.togglePasswordAria">
          @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
          }
        </button>
      </div>
    </div>
    <div class="flex items-center justify-between">
      <label class="flex items-center gap-2 text-sm text-[#646D77]">
        <input
          name="rememberPassword" type="checkbox" [checked]="rememberPassword()"
          (change)="rememberPassword.set($any($event.target).checked)"
          class="h-4 w-4 accent-salmon"
        />
        <span i18n="Remember password label|@@login.rememberPassword">Remember password</span>
      </label>
      <a routerLink="/forgot-password" class="text-sm font-medium text-salmon hover:text-[#e9855a]" i18n="Forgot password link|@@login.forgotPassword">Forgot password?</a>
    </div>
    <button
      type="submit"
      data-testid="login-submit"
      [disabled]="auth.loading()"
      class="w-full rounded-md uppercase tracking-wider bg-salmon px-4 py-2.5 text-sm font-medium text-white hover:bg-[#e9855a] disabled:opacity-50"
    >
      {{ submitLabel() }}
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-[#797979]">
    <ng-container i18n="New user prompt|@@login.newHere">New here? </ng-container>
    <a routerLink="/register" class="font-medium text-salmon" i18n="Create account link|@@login.createAccount">Create an account</a>
  </p>
  </div>
</div>
