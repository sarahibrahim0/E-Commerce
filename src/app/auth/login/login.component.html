<div class="mx-auto max-w-md px-4 py-16">
  <h1 class="text-2xl font-bold text-blue-black">Sign in</h1>
  <p class="mt-1 text-sm text-[#797979]">Welcome back!</p>

  @if (auth.error(); as err) {
    <p class="mt-4 rounded-md bg-[#fff5f5] p-3 text-sm text-[#ff4545]">{{ err }}</p>
  }

  <form class="mt-6 space-y-4" (ngSubmit)="submit()">
    <div>
      <label for="email" class="block text-sm font-medium text-[#646D77]">Email</label>
      <input
        id="email" name="email" type="email" required autocomplete="email"
        [value]="email()" (input)="email.set($any($event.target).value)"
        class="mt-1 w-full rounded-md border border-[#c9c9c9] px-3 py-2 text-sm outline-none focus:border-salmon"
      />
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-[#646D77]">Password</label>
      <input
        id="password" name="password" type="password" required autocomplete="current-password"
        [value]="password()" (input)="password.set($any($event.target).value)"
        class="mt-1 w-full rounded-md border border-[#c9c9c9] px-3 py-2 text-sm outline-none focus:border-salmon"
      />
    </div>
    <div class="flex items-center justify-between">
      <span></span>
      <a routerLink="/forgot-password" class="text-sm font-medium text-salmon hover:text-[#e9855a]">Forgot password?</a>
    </div>
    <button
      type="submit"
      data-testid="login-submit"
      [disabled]="auth.loading()"
      class="w-full rounded-none uppercase tracking-wider bg-salmon px-4 py-2.5 text-sm font-medium text-white hover:bg-[#e9855a] disabled:opacity-50"
    >
      {{ auth.loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-[#797979]">
    New here? <a routerLink="/register" class="font-medium text-salmon">Create an account</a>
  </p>
</div>
