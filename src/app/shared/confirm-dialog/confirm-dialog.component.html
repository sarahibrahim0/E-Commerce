@if (dialog.state(); as state) {
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-blue-black/50 p-4">
    <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow-xl" role="alertdialog" aria-modal="true">
      <h2 class="text-lg font-semibold text-blue-black">{{ state.options.title }}</h2>
      <p class="mt-2 text-sm text-[#646D77]">{{ state.options.message }}</p>
      <div class="mt-6 flex justify-end gap-2">
        <button
          type="button"
          class="rounded-md border border-[#c9c9c9] px-4 py-2 text-sm text-[#646D77] hover:bg-[#ecd7cd]"
          (click)="cancel()"
        >
          {{ state.options.cancelLabel ?? 'Cancel' }}
        </button>
        <button
          type="button"
          class="rounded-md bg-[#ff4545] px-4 py-2 text-sm text-white hover:bg-[#e63e3e]"
          (click)="confirm()"
        >
          {{ state.options.confirmLabel ?? 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
