<div class="pointer-events-none fixed end-4 top-4 z-50 flex w-80 flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      role="status"
      [class]="'pointer-events-auto rounded-md px-4 py-3 text-sm text-white shadow-lg ' +
        (toast.type === 'success' ? 'bg-emerald-600' :
         toast.type === 'error' ? 'bg-[#ff4545]' : 'bg-blue-black')"
    >
      {{ toast.message }}
      <button
        type="button"
        aria-label="Dismiss"
        i18n-aria-label="Dismiss toast notification|@@toast.dismissAria"
        class="float-end font-bold"
        (click)="toastService.dismiss(toast.id)"
      >
        &times;
      </button>
    </div>
  }
</div>
