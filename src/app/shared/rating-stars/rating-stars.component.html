<span class="inline-flex items-center gap-0.5" aria-label="Rating {{ rating() }} of 5">
  @for (filled of stars(); track $index) {
    <svg
      [class]="'inline-block ' + sizeClass() + (filled ? ' text-amber-400' : ' text-slate-300')"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path d="M10 1.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L1.5 7.7l5.9-.9L10 1.5z" />
    </svg>
  }
</span>
