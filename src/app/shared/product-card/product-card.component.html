<div class="group relative flex flex-col overflow-hidden rounded-lg border border-[#F6F8FE] bg-white transition-shadow hover:shadow-lg">
  <button
    type="button"
    data-testid="wishlist-heart"
    [attr.data-wishlisted]="wishlisted() ? 'true' : 'false'"
    aria-label="Toggle wishlist"
    class="absolute right-2 top-2 z-10 rounded-full bg-white/90 p-1.5 text-[#c9c9c9] hover:text-[#ff4545]"
    (click)="toggleWishlist()"
  >
    <svg class="h-5 w-5" [class]="wishlisted() ? 'fill-[#ff4545] text-[#ff4545]' : 'fill-none'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7.5-4.6-9.5-8.6C.9 9.4 2.6 6 5.6 6c1.9 0 3.2 1 4.4 2.7C11.2 7 12.5 6 14.4 6c3 0 4.7 3.4 3.1 6.4C15.5 16.4 12 21 12 21z" />
    </svg>
  </button>

  <a routerLink="/product/{{ product().id }}" class="block">
    <div class="aspect-square w-full overflow-hidden bg-[#ecd7cd]">
      @if (image()) {
        <img [src]="image()" [alt]="product().name" class="h-full w-full object-cover transition-transform group-hover:scale-105" loading="lazy" />
      } @else {
        <div class="flex h-full items-center justify-center text-[#c9c9c9]">No image</div>
      }
    </div>
  </a>

  <div class="flex flex-1 flex-col gap-1 p-3">
    @if (product().brand) {
      <p class="text-xs uppercase tracking-wide text-[#c9c9c9]">{{ product().brand }}</p>
    }
    <a routerLink="/product/{{ product().id }}" class="line-clamp-2 text-sm font-medium text-blue-black hover:text-salmon">
      {{ product().name }}
    </a>
    <div class="flex items-center gap-1 text-xs text-[#797979]">
      <app-rating-stars [rating]="product().rating" size="sm" />
      <span>({{ product().numbReviews }})</span>
    </div>
    <p class="mt-1 text-lg font-semibold text-dark-purple">{{ price() }}</p>
    @if (outOfStock()) {
      <span class="mt-2 rounded bg-[#ecd7cd] px-2 py-1 text-center text-xs font-medium text-[#797979]">Out of stock</span>
    } @else {
      <button
        type="button"
        data-testid="add-to-cart"
        class="mt-2 rounded-none uppercase tracking-wider bg-salmon px-3 py-1.5 text-sm font-medium text-white hover:bg-[#e9855a]"
        (click)="onAddToCart()"
      >
        Add to cart
      </button>
    }
  </div>
</div>
