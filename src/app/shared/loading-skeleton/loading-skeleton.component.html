<div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4" role="status" aria-label="Loading">
  @for (_ of [0, 1, 2, 3, 4, 5, 6, 7]; track $index) {
    <div class="animate-pulse rounded-lg border border-[#F6F8FE] p-3">
      <div class="aspect-square rounded bg-[#ecd7cd]"></div>
      <div class="mt-3 h-4 w-3/4 rounded bg-[#ecd7cd]"></div>
      <div class="mt-2 h-4 w-1/3 rounded bg-[#ecd7cd]"></div>
    </div>
  }
</div>
